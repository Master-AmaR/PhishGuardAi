<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PhishGuard AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="sidebar-scrim" data-sidebar-close></div>
<aside class="pg-sidebar">
    <div class="brand-lockup">
        <i class="bi bi-shield-shaded brand-icon"></i>
        <div>
            <h1>PhishGuard AI</h1>
            <p>Threat intelligence</p>
        </div>
    </div>
    <button class="sidebar-collapse" type="button" data-sidebar-collapse title="Collapse sidebar" aria-label="Collapse sidebar">
        <i class="bi bi-layout-sidebar-inset"></i>
    </button>
    <div class="version">{{ app_version }}</div>
    <nav class="pg-nav">
        <a class="{{ 'active' if active_page == 'dashboard' }}" href="{{ url_for('dashboard.dashboard') }}"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
        <a class="{{ 'active' if active_page == 'url_scanner' }}" href="{{ url_for('dashboard.url_scanner') }}"><i class="bi bi-globe2"></i><span>URL Scanner</span></a>
        <a class="{{ 'active' if active_page == 'email_analyzer' }}" href="{{ url_for('dashboard.email_analyzer') }}"><i class="bi bi-envelope"></i><span>Email Analyzer</span></a>
        <a class="{{ 'active' if active_page == 'threat_intelligence' }}" href="{{ url_for('dashboard.threat_intelligence') }}"><i class="bi bi-crosshair"></i><span>Reputation Lookup</span></a>
        <a class="{{ 'active' if active_page == 'logs' }}" href="{{ url_for('dashboard.logs') }}"><i class="bi bi-terminal"></i><span>Detection Logs</span></a>
        <a class="{{ 'active' if active_page == 'reports' }}" href="{{ url_for('dashboard.reports') }}"><i class="bi bi-file-earmark-bar-graph"></i><span>Reports</span></a>
    </nav>
    <a class="settings-link" href="#"><i class="bi bi-gear"></i><span>System Settings</span></a>
</aside>

<main class="pg-main">
    <header class="pg-topbar">
        <button class="mobile-menu icon-button" type="button" data-sidebar-open title="Open menu" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <a class="top-brand" href="{{ url_for('dashboard.dashboard') }}"><i class="bi bi-shield-fill-check"></i> PhishGuard AI</a>
        <div class="top-actions">
            <button class="icon-button" type="button" title="Notifications"><i class="bi bi-bell"></i></button>
            <button class="icon-button" type="button" title="Account"><i class="bi bi-person"></i></button>
        </div>
    </header>
    <section class="pg-content">
        {% block content %}{% endblock %}
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
